stages:
  - test
  - build

variables:
  CGO_ENABLED: "0"
  GOFLAGS: "-trimpath"

go-test:
  stage: test
  image: golang:1.22-alpine
  script:
    - /usr/local/go/bin/go test ./...

build-openwrt-release:
  stage: build
  image: golang:1.22-alpine
  needs:
    - go-test
  script:
    - mkdir -p dist
    - GOOS=linux GOARCH=arm64 /usr/local/go/bin/go build -trimpath -ldflags "-s -w" -o dist/sitewatch-linux-arm64 ./cmd/sitewatch
    - GOOS=linux GOARCH=arm GOARM=7 /usr/local/go/bin/go build -trimpath -ldflags "-s -w" -o dist/sitewatch-linux-armv7 ./cmd/sitewatch
    - GOOS=linux GOARCH=arm GOARM=6 /usr/local/go/bin/go build -trimpath -ldflags "-s -w" -o dist/sitewatch-linux-armv6 ./cmd/sitewatch
    - GOOS=linux GOARCH=amd64 /usr/local/go/bin/go build -trimpath -ldflags "-s -w" -o dist/sitewatch-linux-amd64 ./cmd/sitewatch
    - GOOS=linux GOARCH=386 /usr/local/go/bin/go build -trimpath -ldflags "-s -w" -o dist/sitewatch-linux-386 ./cmd/sitewatch
    - GOOS=linux GOARCH=mips GOMIPS=softfloat /usr/local/go/bin/go build -trimpath -ldflags "-s -w" -o dist/sitewatch-linux-mips ./cmd/sitewatch
    - GOOS=linux GOARCH=mipsle GOMIPS=softfloat /usr/local/go/bin/go build -trimpath -ldflags "-s -w" -o dist/sitewatch-linux-mipsle ./cmd/sitewatch
    - sha256sum dist/sitewatch-linux-* > dist/SHA256SUMS
  artifacts:
    name: "sitewatch-openwrt-release-$CI_COMMIT_SHORT_SHA"
    expire_in: 30 days
    paths:
      - dist/
