stages:
  - test
  - build

variables:
  CGO_ENABLED: "0"
  GOFLAGS: "-trimpath"

go-test:
  stage: test
  image: golang:1.22-alpine
  script:
    - /usr/local/go/bin/go test ./...

build-openwrt-arm64:
  stage: build
  image: golang:1.22-alpine
  needs:
    - go-test
  variables:
    GOOS: linux
    GOARCH: arm64
  script:
    - mkdir -p dist
    - /usr/local/go/bin/go build -trimpath -ldflags "-s -w" -o dist/sitewatch-linux-arm64 ./cmd/sitewatch
    - sha256sum dist/sitewatch-linux-arm64 > dist/sitewatch-linux-arm64.sha256
  artifacts:
    name: "sitewatch-openwrt-arm64-$CI_COMMIT_SHORT_SHA"
    expire_in: 30 days
    paths:
      - dist/sitewatch-linux-arm64
      - dist/sitewatch-linux-arm64.sha256
