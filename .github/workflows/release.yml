name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Test
        run: go test ./...

      - name: Build OpenWrt binaries
        run: |
          mkdir -p dist
          GOOS=linux GOARCH=arm64 go build -trimpath -ldflags "-s -w" -o dist/sitewatch-linux-arm64 ./cmd/sitewatch
          GOOS=linux GOARCH=arm GOARM=7 go build -trimpath -ldflags "-s -w" -o dist/sitewatch-linux-armv7 ./cmd/sitewatch
          GOOS=linux GOARCH=arm GOARM=6 go build -trimpath -ldflags "-s -w" -o dist/sitewatch-linux-armv6 ./cmd/sitewatch
          GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o dist/sitewatch-linux-amd64 ./cmd/sitewatch
          GOOS=linux GOARCH=386 go build -trimpath -ldflags "-s -w" -o dist/sitewatch-linux-386 ./cmd/sitewatch
          GOOS=linux GOARCH=mips GOMIPS=softfloat go build -trimpath -ldflags "-s -w" -o dist/sitewatch-linux-mips ./cmd/sitewatch
          GOOS=linux GOARCH=mipsle GOMIPS=softfloat go build -trimpath -ldflags "-s -w" -o dist/sitewatch-linux-mipsle ./cmd/sitewatch
          sha256sum dist/sitewatch-linux-* > dist/SHA256SUMS

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "SiteWatch $RELEASE_TAG" \
            --notes-file RELEASE_NOTES.md
